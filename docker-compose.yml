# Порты выбраны нестандартными сознательно: на машине разработки 5432/6379/8080
# уже заняты другими проектами. Наружу торчит только то, что нужно проверяющему.
#
# Заглушки поставщиков (supplier-a / supplier-b / supplier-redis) добавляются
# на шаге Ш4 — до него `make up` обязан подниматься целиком (docs/PLAN.md).

# Важно: env_file здесь НЕ используется. Laravel сам читает .env как файл, а всё,
# что попало в окружение процесса, перекрыть уже нельзя — ни из phpunit.xml, ни
# из .env.testing. Именно так тесты однажды ушли работать по боевой базе.
# В environment остаётся только то, что действительно отличает контейнер от хоста.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamestore
      POSTGRES_USER: gamestore
      POSTGRES_PASSWORD: gamestore
      # C-локаль: детерминированный порядок сортировки, важен для keyset-пагинации
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamestore -d gamestore"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Встроенный сервер PHP по умолчанию однопоточный: 50 «параллельных»
      # вебхуков выстроились бы в очередь, и гонка, которую мы обязаны
      # доказать, просто не возникла бы.
      PHP_CLI_SERVER_WORKERS: "16"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Очереди разделены намеренно: медленная выдача не имеет права морить голодом
  # применение платежей (CLAUDE.md §5.2).
  worker-payments:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /app
    command: ["php", "artisan", "queue:work", "redis", "--queue=payments", "--tries=5", "--max-time=3600"]
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker-delivery:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /app
    command: ["php", "artisan", "queue:work", "redis", "--queue=delivery", "--tries=5", "--max-time=3600"]
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /app
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  # Две заглушки поставщика из одного образа. Отдельный Redis со включённым
  # AOF и своим томом: если стор потеряет данные, повтор с тем же request_id
  # выдаст ВТОРОЙ код и сломает контракт идемпотентности на ровном месте.
  supplier-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - supplierdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  supplier-a:
    build:
      context: ./docker/supplier
    ports:
      - "8001:8080"
    environment:
      SUPPLIER_NAME: A
      SUPPLIER_REDIS_HOST: supplier-redis
      # Доли сбоев из задания — поведение по умолчанию для демонстрации.
      # Тесты задают режим предписанно, потому что тест на вероятности —
      # это не тест.
      SUPPLIER_ERROR_RATE: "0"
      SUPPLIER_TIMEOUT_RATE: "0"
    depends_on:
      supplier-redis: {condition: service_healthy}

  supplier-b:
    build:
      context: ./docker/supplier
    ports:
      - "8002:8080"
    environment:
      SUPPLIER_NAME: B
      SUPPLIER_REDIS_HOST: supplier-redis
      SUPPLIER_ERROR_RATE: "0"
      SUPPLIER_TIMEOUT_RATE: "0"
    depends_on:
      supplier-redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  supplierdata:
